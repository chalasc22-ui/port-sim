[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-layout"
version = "0.2.0"
description = "Terminal layout and topology module for the port simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "networkx>=3.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["terminal_layout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
