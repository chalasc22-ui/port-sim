<title>The learning curve of the dispatch rule</title>
<desc>Three line charts over the number of training shifts: how long a job waits for its AGV, how far the AGVs drive, and quay moves per crane-hour, each measured on the development shifts, with the level of two hand-written rules drawn across.</desc>
