<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 312" width="940" height="312" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The dispatch rules compared on the held-out shifts</title>
<desc>A dot and a 95 percent interval for each of four rules on four measures, each as a difference from the rule the terminal runs as planned. Full dots mark intervals clear of zero; the better side of zero is shaded.</desc>
<rect width="940" height="312" fill="#ffffff"/>
<text x="16.0" y="24.0" font-size="14" fill="#1c2422" text-anchor="start" font-weight="600">Learned (Q-learning) is better than the planned rule on three of these four measures</text>
<text x="16.0" y="43.0" font-size="12" fill="#1c2422" text-anchor="start" font-weight="400">Against Nearest job first, a rule written by hand, it is better on none and worse on one.</text>
<text x="16.0" y="60.0" font-size="12" fill="#55615d" text-anchor="start" font-weight="400">Each row is a rule minus the planned rule, Nearest with charge, on the same 30 shifts, which training never saw.</text>
<line x1="16" x2="42" y1="81" y2="81" stroke="#8b9692" stroke-width="2" stroke-linecap="round"/><circle cx="29.0" cy="81.0" r="4.9" fill="#55615d" stroke="#ffffff" stroke-width="2"></circle>
<text x="49.0" y="85.0" font-size="12" fill="#55615d" text-anchor="start" font-weight="400">mean and 95 percent interval, clear of zero: more than chance</text>
<line x1="458.96000000000004" x2="484.96000000000004" y1="81" y2="81" stroke="#8b9692" stroke-width="2" stroke-linecap="round"/><circle cx="472.0" cy="81.0" r="3.2" fill="#ffffff" stroke="#55615d" stroke-width="1.8"></circle>
<text x="492.0" y="85.0" font-size="12" fill="#55615d" text-anchor="start" font-weight="400">the interval reaches zero: no sure difference</text>
<rect x="800.2" y="75" width="18" height="12" fill="#55615d" fill-opacity="0.09"/>
<text x="825.2" y="85.0" font-size="12" fill="#55615d" text-anchor="start" font-weight="400">the better side</text>
