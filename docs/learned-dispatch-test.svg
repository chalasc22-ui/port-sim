<text x="16.0" y="196.0" font-size="12" fill="#1c2422" text-anchor="start" font-weight="400">Distance, idle, charge</text>
<text x="16.0" y="232.0" font-size="12" fill="#1c2422" text-anchor="start" font-weight="400">Nearest job first</text>
